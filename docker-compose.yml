services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ai_runtime
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
    ports:
      - "127.0.0.1:5533:5432"
  migrator:
    build: .
    env_file: [.env]
    command: ["alembic", "upgrade", "head"]
    depends_on: [postgres]
  api:
    build: .
    env_file: [.env]
    depends_on: [migrator]
    ports:
      - "127.0.0.1:8330:8330"
